# Disposable synthetic development database only; not production or a backup.
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      # Name is derived from the launcher's strictly local SPRING_DATASOURCE_URL.
      POSTGRES_DB: ${LONGNEST_DEV_DB_NAME:?Use scripts/dev-server.sh}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:?Configure SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Configure SPRING_DATASOURCE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Container-only writable layer, outside the image-declared VOLUME.
      PGDATA: /tmp/longnest-pgdata
    ports:
      - "127.0.0.1:54329:5432"
    restart: "no"
    stop_grace_period: 30s
