command.start=Bắt đầu
error.chatbot.unavailable=Em chưa kết nối được lúc này, thử lại sau giúp em nhé.
error.chatbot.empty-response=Em chưa có câu trả lời lúc này, thử lại giúp em nhé.
error.chatbot.invalid-response=Em chưa đọc rõ được tin này nên chưa ghi khoản nào. Thử diễn đạt lại giúp em nhé.
error.transaction.save-failed=Em chưa lưu được khoản này, xem lại sổ trước khi thử lại nhé.
error.draft.not-found=Em không tìm thấy bản nháp tương ứng trong cuộc trò chuyện này.
error.draft.update-failed=Em chưa cập nhật được bản nháp, thử lại giúp em nhé.
error.draft.context-changed=Thông tin đã thay đổi, trả lời câu hỏi mới nhất giúp em nhé.
error.internal=Em gặp lỗi lúc xử lý, thử lại sau giúp em nhé.
error.query.invalid-parameters=Em chưa xác định được bộ lọc hợp lệ. Kiểm tra loại thu/chi và khoảng ngày giúp em nhé.
error.query.failed=Em chưa lấy được danh sách lúc này, thử lại sau giúp em nhé.
error.transaction.deleted=Em đã xóa vĩnh viễn khoản này khỏi sổ. Tin cũ không tạo lại khoản này nhé.
error.transaction.input-processed=Em đã xử lý tin này trong thao tác sửa/xóa rồi. Xem lại sổ hoặc gửi tin mới nhé.
