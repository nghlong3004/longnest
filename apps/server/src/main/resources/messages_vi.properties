help.body=Gửi một giao dịch đầy đủ, ví dụ: ăn trưa 45k hoặc nhận lương 25tr.\n/recent — danh sách với Trang sau/Trang trước và nút Xem; /show ID — giao dịch hiện tại.\nChọn Sửa rồi Lưu thay đổi; /delete ID hoặc nút Xóa chỉ mở xác nhận. Mở giao dịch đã xóa và nhấn Khôi phục một lần.\n/overview 2026-10-01 2026-10-31 — tổng thu, chi và chênh lệch.\n/income 2026-10-01 2026-10-31 hoặc /expenses 2026-10-01 2026-10-31 — tổng và danh sách theo loại.\n/transactions 2026-10-01 2026-10-31 — mọi giao dịch trong khoảng ngày, gồm cả hai ngày đầu/cuối.
