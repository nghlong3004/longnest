range.food=Chi tiêu ăn uống (FOOD)
conversation.AMOUNT=Khoản này bao nhiêu tiền? Bạn ghi rõ số tiền giúp mình nhé.
conversation.captureAgain=Bạn gửi lại đầy đủ khoản thu/chi và số tiền trong một tin nhắn nhé, ví dụ: ăn trưa 45k.
conversation.amountStale=Câu hỏi số tiền đó không còn là câu hỏi hiện tại. Bạn trả lời câu hỏi số tiền mới nhất hoặc gửi lại đầy đủ khoản thu/chi nhé.
conversation.TYPE=Đây là khoản thu hay khoản chi?
conversation.DATES=Bạn muốn xem ngày hoặc khoảng thời gian nào?
conversation.TARGET=Bạn muốn chọn giao dịch nào? Hãy ghi mã hoặc chọn giao dịch trước nhé.
conversation.AMBIGUOUS=Mình chưa xác định chắc yêu cầu này. Bạn nói rõ khoản thu/chi, thời gian hoặc giao dịch cần xem hay sửa giúp mình nhé.
conversation.UNSUPPORTED=Mình chưa hỗ trợ điều kiện hoặc thao tác đó. Mình có thể xem thu/chi, lọc ăn uống (FOOD), lưu khoản rõ ràng và tạo bản xem trước để bạn xác nhận.
conversation.busy=Mình đang xử lý yêu cầu trước. Bạn đợi một chút rồi thử lại nhé.
conversation.limit=Đã chạm giới hạn diễn giải trong giờ này. Bạn vẫn có thể dùng lệnh và các nút hiện có.
conversation.unavailable=Mình chưa thể diễn giải lúc này. Bạn thử lại sau nhé; dùng cùng yêu cầu nếu chưa nhận được kết quả.
conversation.reset=Đã xóa ngữ cảnh trò chuyện tạm thời. Các giao dịch và xác nhận đang có không thay đổi.
