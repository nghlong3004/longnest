query.clarification={0}\nBạn muốn xem khoản thu, khoản chi hay tất cả giao dịch? Hãy nêu hai ngày cụ thể theo dạng YYYY-MM-DD, ví dụ: {1}\nBạn cũng có thể dùng /income, /expenses hoặc /transactions kèm hai ngày. Chưa có dữ liệu nào bị thay đổi.
help.queryHint=Khi đã bật diễn giải, bạn có thể hỏi: Hôm qua anh chi bao nhiêu? Tháng này thì sao? Chỉ tiền ăn thôi. Tháng này tính từ ngày đầu tháng đến hôm nay; tiền ăn chỉ gồm danh mục FOOD. Dùng /reset để xóa ngữ cảnh tạm thời.
