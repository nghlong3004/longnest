spring:
  profiles:
    group:
      ledger-init: ledger
  application:
    name: longnest
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  main:
    web-application-type: none
    keep-alive: true
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never
  ai:
    model:
      chat: none

longnest:
  deepseek:
    enabled: false
  telegram:
    enabled: false

# Upstream's malformed-response warning can include prompts. Never log that class.
logging:
  level:
    org.springframework.ai.deepseek.DeepSeekChatModel: "OFF"
