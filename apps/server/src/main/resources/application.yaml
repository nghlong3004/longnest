
spring:
  profiles:
    group:
      ledger-init:
        - ledger

  application:
    name: longnest

  messages:
    # basename và encoding đã có mặc định tương ứng trong Spring Boot.
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  main:
    web-application-type: none
    keep-alive: true

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 20s

  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 5s
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 10s

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  sql:
    init:
      mode: never

  ai:
    model:
      chat: none

longnest:
  deepseek:
    enabled: false
  telegram:
    enabled: ${LONGNEST_TELEGRAM_ENABLED:false}
    token: ${LONGNEST_TELEGRAM_TOKEN:}
    user: ${LONGNEST_TELEGRAM_USER:}

logging:
  level:
    org.springframework.ai: "OFF"
    org.springframework.ai.deepseek.DeepSeekChatModel: "OFF"
